<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trino TPC-DS 분석 대시보드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  <style>
    :root { color-scheme: dark; }
    body { background: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }
    .sidebar { background: #1e293b; border-right: 1px solid #334155; }
    .chat-area { background: #0f172a; }
    .user-bubble { background: #6366f1; border-radius: 1rem 1rem 0.25rem 1rem; }
    .bot-bubble  { background: #1e293b; border: 1px solid #334155; border-radius: 1rem 1rem 1rem 0.25rem; }
    .analysis-btn { transition: background 0.15s; }
    .analysis-btn:hover { background: #334155; }
    .analysis-btn.active { background: #312e81; border-left: 3px solid #6366f1; }
    textarea:focus { outline: none; box-shadow: 0 0 0 2px #6366f1; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    .table-wrap { max-height: 300px; overflow-y: auto; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 9999px; font-size: 0.7rem; }
    pre { white-space: pre-wrap; word-break: break-word; }
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid #334155; border-top-color: #6366f1;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* ── 차트 타입 버튼 ── */
    .ct-bar { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
    .ct-btn {
      padding: 3px 9px; border-radius: 5px; font-size: 11px; cursor: pointer;
      border: 1px solid #334155; background: #0f172a; color: #64748b;
      transition: all 0.15s; white-space: nowrap;
    }
    .ct-btn:hover { background: #1e293b; color: #e2e8f0; border-color: #475569; }
    .ct-btn.ct-active { background: #312e81; border-color: #6366f1; color: #a5b4fc; font-weight: 600; }
  </style>
</head>
<body class="h-screen flex overflow-hidden">

  <!-- 사이드바 -->
  <aside class="sidebar w-72 flex flex-col flex-shrink-0 overflow-hidden">
    <!-- 로고 -->
    <div class="p-4 border-b border-slate-700">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-sm">T</div>
        <div>
          <p class="font-semibold text-white text-sm">Trino TPC-DS</p>
          <p class="text-xs text-slate-400">자연어 분석 대시보드</p>
        </div>
      </div>
      <!-- 서버 상태 -->
      <div class="mt-3 flex items-center gap-2">
        <span id="status-dot" class="w-2 h-2 rounded-full bg-slate-500"></span>
        <span id="status-text" class="text-xs text-slate-400">연결 확인 중...</span>
      </div>
    </div>

    <!-- 분석 목록 -->
    <div class="flex-1 overflow-y-auto p-2">
      <p class="text-xs text-slate-500 px-2 py-2 uppercase tracking-wider">분석 목록</p>
      {% for a in analyses %}
      <button
        class="analysis-btn w-full text-left px-3 py-2.5 rounded-lg mb-1"
        onclick="runById('{{ a.id }}', '{{ a.name }}')"
        data-id="{{ a.id }}">
        <div class="flex items-center gap-2">
          <span class="text-xs font-mono text-slate-500 w-5">{{ a.id }}</span>
          <span class="text-sm text-slate-200 leading-tight">{{ a.name }}</span>
        </div>
        <p class="text-xs text-slate-500 mt-0.5 ml-7 leading-tight">{{ a.description[:40] }}...</p>
      </button>
      {% endfor %}
    </div>

    <!-- 사용 팁 -->
    <div class="p-4 border-t border-slate-700">
      <p class="text-xs text-slate-500">💡 자연어로 질문하거나 목록을 클릭하세요</p>
    </div>
  </aside>

  <!-- 메인 영역 -->
  <main class="flex-1 flex flex-col overflow-hidden">

    <!-- 헤더 -->
    <div class="flex-shrink-0 p-4 border-b border-slate-800 flex items-center justify-between">
      <h1 class="text-white font-semibold">분석 채팅</h1>
      <button onclick="clearChat()" class="text-xs text-slate-400 hover:text-white px-3 py-1.5 rounded bg-slate-800 hover:bg-slate-700 transition">
        대화 초기화
      </button>
    </div>

    <!-- 채팅 영역 -->
    <div id="chat" class="flex-1 overflow-y-auto p-6 space-y-6">
      <!-- 환영 메시지 -->
      <div class="max-w-2xl mx-auto text-center py-12">
        <div class="w-16 h-16 bg-indigo-600 rounded-2xl mx-auto mb-4 flex items-center justify-center text-3xl">📊</div>
        <h2 class="text-xl font-semibold text-white mb-2">TPC-DS 자연어 분석</h2>
        <p class="text-slate-400 text-sm leading-relaxed">
          아래 입력창에 자연어로 분석을 요청하거나,<br/>왼쪽 목록에서 분석을 선택하세요.
        </p>
        <div class="mt-6 flex flex-wrap gap-2 justify-center">
          <span onclick="sendExample('월별 매출 트렌드를 분석해서 보여줘')"
                class="cursor-pointer text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-full transition">
            월별 매출 트렌드를 분석해서 보여줘
          </span>
          <span onclick="sendExample('채널별 매출 비교 분석')"
                class="cursor-pointer text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-full transition">
            채널별 매출 비교 분석
          </span>
          <span onclick="sendExample('고객 CLV 분석')"
                class="cursor-pointer text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-full transition">
            고객 CLV 분석
          </span>
          <span onclick="sendExample('재고 현황 분석')"
                class="cursor-pointer text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-full transition">
            재고 현황 분석
          </span>
          <span onclick="sendExample('프로모션 효과 분석')"
                class="cursor-pointer text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-full transition">
            프로모션 효과 분석
          </span>
        </div>
      </div>
    </div>

    <!-- 입력창 -->
    <div class="flex-shrink-0 p-4 border-t border-slate-800">
      <div class="flex gap-3 items-end">
        <textarea
          id="input"
          rows="2"
          placeholder="분석 요청을 자연어로 입력하세요... (예: 월별 매출 트렌드를 분석해서 보여줘)"
          class="flex-1 bg-slate-800 text-slate-100 text-sm rounded-xl px-4 py-3 resize-none border border-slate-700 placeholder-slate-500"
          onkeydown="handleKey(event)"
        ></textarea>
        <button
          id="send-btn"
          onclick="sendQuery()"
          class="flex-shrink-0 bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-3 rounded-xl text-sm font-medium transition flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
          </svg>
          분석
        </button>
      </div>
    </div>
  </main>

  <script>
  // ── 서버 상태 확인 ──────────────────────────────────────────────────────────
  async function checkHealth() {
    try {
      const r = await fetch('/api/health');
      const d = await r.json();
      if (d.trino === 'ok') {
        document.getElementById('status-dot').className = 'w-2 h-2 rounded-full bg-green-400';
        document.getElementById('status-text').textContent = `Trino ${d.version} 연결됨`;
      } else {
        throw new Error(d.message);
      }
    } catch (e) {
      document.getElementById('status-dot').className = 'w-2 h-2 rounded-full bg-red-400';
      document.getElementById('status-text').textContent = '서버 연결 안됨';
    }
  }
  checkHealth();
  setInterval(checkHealth, 30000);

  // ── 메시지 추가 ─────────────────────────────────────────────────────────────
  let msgCounter = 0;

  function appendUserMsg(text) {
    const chat = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = 'flex justify-end';
    div.innerHTML = `
      <div class="user-bubble max-w-lg px-4 py-3 text-white text-sm">${escHtml(text)}</div>
    `;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function appendLoading() {
    const chat = document.getElementById('chat');
    const id = `msg-${++msgCounter}`;
    const div = document.createElement('div');
    div.id = id;
    div.className = 'flex justify-start';
    div.innerHTML = `
      <div class="bot-bubble px-4 py-3 flex items-center gap-3">
        <div class="spinner"></div>
        <span class="text-slate-400 text-sm">분석 중...</span>
      </div>
    `;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return id;
  }

  // ── 차트 타입 전환 ─────────────────────────────────────────────────────────
  const _chartStore = {};

  const CT_TYPES = [
    { key: 'bar',        label: '📊 막대' },
    { key: 'horizontal', label: '↔ 가로막대' },
    { key: 'line',       label: '📈 라인' },
    { key: 'area',       label: '🌊 영역' },
    { key: 'pie',        label: '🥧 파이' },
    { key: 'scatter',    label: '⬤ 산점도' },
  ];

  function detectInitType(chartData) {
    if (!chartData?.data?.[0]) return 'bar';
    const t = chartData.data[0];
    if (t.type === 'pie') return 'pie';
    if (t.orientation === 'h') return 'horizontal';
    if (t.type === 'scatter') {
      if (t.fill) return 'area';
      return (t.mode || '').includes('lines') ? 'line' : 'scatter';
    }
    return 'bar';
  }

  function _buildTrace(type, xVals, yVals) {
    const COLORS = { bar: '#6366f1', line: '#22d3ee', area: '#6366f1', scatter: '#f59e0b', horizontal: '#8b5cf6' };
    if (type === 'pie') {
      return { type: 'pie', labels: xVals, values: yVals, hole: 0.38,
               textinfo: 'label+percent', hoverinfo: 'label+value+percent',
               marker: { colors: ['#6366f1','#8b5cf6','#22d3ee','#f59e0b','#10b981','#ef4444',
                                   '#f97316','#06b6d4','#84cc16','#e879f9','#fb7185','#34d399'] } };
    }
    if (type === 'line') {
      return { type: 'scatter', mode: 'lines+markers', x: xVals, y: yVals,
               line: { color: COLORS.line, width: 2 }, marker: { size: 6, color: COLORS.line } };
    }
    if (type === 'area') {
      return { type: 'scatter', mode: 'lines', x: xVals, y: yVals, fill: 'tozeroy',
               line: { color: COLORS.area, width: 2 }, fillcolor: 'rgba(99,102,241,0.15)' };
    }
    if (type === 'scatter') {
      return { type: 'scatter', mode: 'markers', x: xVals, y: yVals,
               marker: { color: COLORS.scatter, size: 9, opacity: 0.8 } };
    }
    if (type === 'horizontal') {
      return { type: 'bar', orientation: 'h', y: xVals, x: yVals,
               marker: { color: COLORS.horizontal } };
    }
    return { type: 'bar', x: xVals, y: yVals, marker: { color: COLORS.bar } };
  }

  function _buildLayout(type, n) {
    const isPie = type === 'pie';
    const isH   = type === 'horizontal';
    const angle  = n > 15 ? -45 : (n > 6 ? -30 : 0);
    const bMargin = n > 15 ? 140 : (n > 6 ? 100 : 60);
    const base = {
      paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
      font: { color: '#94a3b8', size: 12 },
      showlegend: isPie,
      margin: isPie ? { l:20, r:20, t:20, b:20 } : isH ? { l:110, r:20, t:10, b:40 } : { l:55, r:20, t:10, b:bMargin },
    };
    if (!isPie) {
      base.xaxis = { gridcolor: '#1e293b', tickfont: { color: '#94a3b8', size: 10 }, tickangle: isH ? 0 : angle };
      base.yaxis = { gridcolor: '#1e293b', tickfont: { color: '#94a3b8', size: 10 } };
    }
    return base;
  }

  function changeChartType(chartId, newType) {
    const s = _chartStore[chartId];
    if (!s) return;
    s.current = newType;
    const trace = _buildTrace(newType, s.x, s.y);
    const layout = _buildLayout(newType, s.x.length);
    Plotly.react(chartId, [trace], layout, { responsive: true, displayModeBar: true,
      modeBarButtonsToRemove: ['sendDataToCloud'] });
    document.querySelectorAll(`[data-cid="${chartId}"]`).forEach(b =>
      b.classList.toggle('ct-active', b.dataset.type === newType));
  }

  function replaceWithResult(loadingId, result) {
    const el = document.getElementById(loadingId);
    if (!el) return;

    const chartId = `chart-${loadingId}`;
    const tableId = `table-${loadingId}`;
    const sqlId   = `sql-${loadingId}`;

    const rows    = result.rows || [];
    const columns = result.columns || [];
    const analysis = result.analysis || {};
    const hasChart = !!result.chart;
    const initType = hasChart ? detectInitType(result.chart) : 'bar';

    // 차트 타입 버튼
    const ctBtns = hasChart ? `
      <div class="ct-bar">
        ${CT_TYPES.map(t => `
          <button class="ct-btn${t.key === initType ? ' ct-active' : ''}"
                  data-cid="${chartId}" data-type="${t.key}"
                  onclick="changeChartType('${chartId}','${t.key}')">${t.label}</button>
        `).join('')}
      </div>` : '';

    // 테이블 HTML
    const tableHtml = rows.length > 0 ? `
      <div class="table-wrap mt-3">
        <table class="w-full text-xs text-left border-collapse">
          <thead>
            <tr>${columns.map(c => `<th class="sticky top-0 bg-slate-900 px-3 py-2 text-slate-400 font-medium border-b border-slate-700 whitespace-nowrap">${escHtml(c)}</th>`).join('')}</tr>
          </thead>
          <tbody>
            ${rows.map(row => `
              <tr class="hover:bg-slate-800 border-b border-slate-800">
                ${row.map(v => `<td class="px-3 py-1.5 text-slate-300 whitespace-nowrap">${v === null ? '<span class="text-slate-600">NULL</span>' : escHtml(String(v))}</td>`).join('')}
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    ` : '<p class="text-slate-500 text-xs mt-2">결과 없음</p>';

    const chartH = rows.length > 15 ? 420 : 320;

    el.outerHTML = `
      <div class="flex justify-start">
        <div class="bot-bubble w-full max-w-3xl p-4">
          <!-- 분석 헤더 -->
          <div class="flex items-center gap-2 mb-2 flex-wrap">
            <span class="tag bg-indigo-900 text-indigo-300 border border-indigo-700">${escHtml(analysis.id || '')} ${escHtml(analysis.name || '')}</span>
            ${result.matched_by === 'nl'
              ? '<span class="tag bg-slate-700 text-slate-300">자연어 매칭</span>'
              : '<span class="tag bg-slate-700 text-slate-300">직접 선택</span>'}
          </div>
          <p class="text-slate-400 text-xs mb-3">${escHtml(analysis.description || '')}</p>

          <!-- 차트 타입 버튼 + 차트 -->
          ${hasChart ? `
            ${ctBtns}
            <div id="${chartId}" class="w-full rounded-lg overflow-hidden" style="height:${chartH}px"></div>
          ` : ''}

          <!-- 데이터 테이블 토글 -->
          <div class="mt-3">
            <button onclick="toggleSection('${tableId}')"
                    class="text-xs text-slate-400 hover:text-white flex items-center gap-1">
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
              </svg>
              데이터 테이블 (${rows.length}행)
            </button>
            <div id="${tableId}" class="hidden">${tableHtml}</div>
          </div>

          <!-- SQL 토글 -->
          <div class="mt-2">
            <button onclick="toggleSection('${sqlId}')"
                    class="text-xs text-slate-400 hover:text-white flex items-center gap-1">
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/>
              </svg>
              실행된 SQL 보기
            </button>
            <div id="${sqlId}" class="hidden mt-2">
              <pre class="text-xs bg-slate-900 text-green-400 p-3 rounded-lg border border-slate-700">${escHtml(result.sql || '')}</pre>
            </div>
          </div>
        </div>
      </div>
    `;

    // Plotly 초기 렌더링 + 데이터 스토어 저장
    if (hasChart) {
      const chartEl = document.getElementById(chartId);
      if (chartEl) {
        const trace0 = result.chart.data[0] || {};
        const xVals = trace0.x || trace0.labels || [];
        const yVals = trace0.y || trace0.values || [];
        _chartStore[chartId] = { x: xVals, y: yVals, current: initType };
        Plotly.newPlot(chartId, result.chart.data, result.chart.layout, {
          responsive: true, displayModeBar: true,
          modeBarButtonsToRemove: ['sendDataToCloud'],
        });
      }
    }

    document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
  }

  function appendError(loadingId, message) {
    const el = document.getElementById(loadingId);
    if (!el) return;
    el.outerHTML = `
      <div class="flex justify-start">
        <div class="bot-bubble px-4 py-3 max-w-lg">
          <p class="text-red-400 text-sm">⚠️ ${escHtml(message)}</p>
        </div>
      </div>
    `;
  }

  // ── 메시지(텍스트) 응답 렌더링 ─────────────────────────────────────────────
  function replaceWithMessage(loadingId, message) {
    const el = document.getElementById(loadingId);
    if (!el) return;
    // 간단한 마크다운: **bold**, *italic*, 줄바꿈
    const html = escHtml(message)
      .replace(/\*\*(.+?)\*\*/g, '<strong class="text-white">$1</strong>')
      .replace(/\*(.+?)\*/g, '<em class="text-slate-300">$1</em>')
      .replace(/\n/g, '<br/>');
    el.outerHTML = `
      <div class="flex justify-start">
        <div class="bot-bubble px-4 py-3 max-w-xl text-sm leading-relaxed text-slate-300">
          ${html}
        </div>
      </div>
    `;
    document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
  }

  // ── 분석 목록 응답 렌더링 ──────────────────────────────────────────────────
  function replaceWithList(loadingId, data) {
    const el = document.getElementById(loadingId);
    if (!el) return;
    const items = (data.analyses || []).map(a => `
      <div class="flex items-start gap-2 py-2 border-b border-slate-700 last:border-0 cursor-pointer hover:bg-slate-800 rounded px-2 -mx-2 transition"
           onclick="runById('${escHtml(a.id)}', '${escHtml(a.name)}')">
        <span class="text-xs font-mono bg-indigo-900 text-indigo-300 px-1.5 py-0.5 rounded mt-0.5 flex-shrink-0">${escHtml(a.id)}</span>
        <div>
          <p class="text-sm font-medium text-slate-200">${escHtml(a.name)}</p>
          <p class="text-xs text-slate-500 leading-snug">${escHtml(a.description)}</p>
        </div>
      </div>
    `).join('');
    el.outerHTML = `
      <div class="flex justify-start">
        <div class="bot-bubble px-4 py-3 w-full max-w-xl">
          <p class="text-sm text-slate-400 mb-3">${escHtml(data.message || '사용 가능한 분석 목록입니다.')}</p>
          <div>${items}</div>
          <p class="text-xs text-slate-600 mt-3">항목을 클릭하면 바로 분석이 실행됩니다.</p>
        </div>
      </div>
    `;
    document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
  }

  // ── 쿼리 실행 ───────────────────────────────────────────────────────────────
  async function sendQuery() {
    const input = document.getElementById('input');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    appendUserMsg(text);
    const loadingId = appendLoading();
    setLoading(true);

    try {
      const resp = await fetch('/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: text }),
      });
      const data = await resp.json();
      if (data.type === 'message') {
        replaceWithMessage(loadingId, data.message);
      } else if (data.type === 'list') {
        replaceWithList(loadingId, data);
      } else if (!resp.ok) {
        appendError(loadingId, data.error || '분석 실패');
      } else {
        replaceWithResult(loadingId, data);
      }
    } catch (e) {
      appendError(loadingId, `요청 실패: ${e.message}`);
    } finally {
      setLoading(false);
    }
  }

  async function runById(id, name) {
    // 사이드바 active 표시
    document.querySelectorAll('.analysis-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`[data-id="${id}"]`)?.classList.add('active');

    appendUserMsg(`${name} 분석 실행`);
    const loadingId = appendLoading();
    setLoading(true);

    try {
      const resp = await fetch('/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id }),
      });
      const data = await resp.json();
      if (!resp.ok) {
        appendError(loadingId, data.error || '분석 실패');
      } else {
        replaceWithResult(loadingId, data);
      }
    } catch (e) {
      appendError(loadingId, `요청 실패: ${e.message}`);
    } finally {
      setLoading(false);
    }
  }

  function sendExample(text) {
    document.getElementById('input').value = text;
    sendQuery();
  }

  // ── 유틸 ────────────────────────────────────────────────────────────────────
  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendQuery();
    }
  }

  function setLoading(on) {
    document.getElementById('send-btn').disabled = on;
    document.getElementById('send-btn').style.opacity = on ? '0.6' : '1';
    document.getElementById('input').disabled = on;
  }

  function toggleSection(id) {
    const el = document.getElementById(id);
    el?.classList.toggle('hidden');
  }

  function clearChat() {
    const chat = document.getElementById('chat');
    chat.innerHTML = '';
    document.querySelectorAll('.analysis-btn').forEach(b => b.classList.remove('active'));
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  </script>
</body>
</html>
