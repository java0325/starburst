<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trino AI 분석 에이전트</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-sankey@0.12/dist/d3-sankey.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/highlight.min.js"></script>
  <!-- hljs CDN 로딩 실패 시 안전 폴백 (hljs is not defined 방지) -->
  <script>
    if (typeof hljs === 'undefined') {
      window.hljs = {
        getLanguage: () => false,
        highlight: (code) => ({ value: code }),
        highlightAuto: (code) => ({ value: code }),
        highlightElement: () => {}
      };
    }
  </script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #212121;
      color: #ececec;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      height: 100dvh;
      display: flex;
      overflow: hidden;
    }

    /* ── 사이드바 ── */
    #sidebar {
      width: 260px;
      min-width: 260px;
      background: #171717;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #2f2f2f;
      transition: width 0.2s, min-width 0.2s;
      overflow: hidden;
    }
    #sidebar.collapsed { width: 0; min-width: 0; border: none; }
    .sidebar-logo {
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #2f2f2f;
    }
    .logo-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px; color: white; flex-shrink: 0;
    }
    .new-chat-btn {
      margin: 10px;
      padding: 9px 14px;
      background: #2f2f2f;
      border: 1px solid #3f3f3f;
      border-radius: 8px;
      color: #ececec;
      font-size: 13px;
      cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .new-chat-btn:hover { background: #3f3f3f; }
    .conv-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
    .conv-item {
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      color: #b0b0b0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.1s, color 0.1s;
    }
    .conv-item:hover { background: #2a2a2a; color: #ececec; }
    .conv-item.active { background: #2f2f2f; color: #ececec; }
    .conv-group-label {
      font-size: 11px; color: #5a5a5a;
      padding: 8px 10px 4px;
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .sidebar-footer {
      padding: 12px;
      border-top: 1px solid #2f2f2f;
      font-size: 12px;
    }
    .model-badge {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 10px;
      background: #2a2a2a;
      border-radius: 6px;
    }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .status-dot.online { background: #22c55e; }
    .status-dot.offline { background: #ef4444; }
    .status-dot.checking { background: #f59e0b; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    /* ── 메인 영역 ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }
    .topbar {
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 10px;
      border-bottom: 1px solid #2f2f2f;
      flex-shrink: 0;
    }
    .toggle-btn {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      background: none; border: none; cursor: pointer;
      color: #8a8a8a; border-radius: 6px;
      transition: background 0.15s, color 0.15s;
    }
    .toggle-btn:hover { background: #2f2f2f; color: #ececec; }
    .model-select {
      background: #2f2f2f; border: 1px solid #3f3f3f;
      border-radius: 8px; color: #ececec;
      font-size: 13px; padding: 5px 10px;
      cursor: pointer;
    }
    .model-select:focus { outline: none; }

    /* ── 채팅 영역 ── */
    #chat-scroll {
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth;
    }
    #chat-scroll::-webkit-scrollbar { width: 5px; }
    #chat-scroll::-webkit-scrollbar-track { background: transparent; }
    #chat-scroll::-webkit-scrollbar-thumb { background: #3f3f3f; border-radius: 3px; }
    #chat-inner {
      max-width: 800px;
      margin: 0 auto;
      padding: 24px 24px 8px;
    }

    /* ── 메시지 ── */
    .msg-row { display: flex; gap: 14px; margin-bottom: 28px; align-items: flex-start; }
    .msg-row.user { flex-direction: row-reverse; }

    .avatar {
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0; font-weight: 600;
    }
    .avatar.ai {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
    }
    .avatar.user {
      background: #3f3f3f;
      color: #ececec;
    }

    .msg-content { flex: 1; min-width: 0; }
    .msg-row.user .msg-content {
      display: flex; justify-content: flex-end;
    }
    .user-bubble {
      background: #2f2f2f;
      border: 1px solid #3f3f3f;
      border-radius: 18px 18px 4px 18px;
      padding: 10px 16px;
      font-size: 14px;
      line-height: 1.6;
      max-width: 75%;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .ai-text {
      font-size: 14px;
      line-height: 1.75;
      color: #ececec;
    }
    .ai-text p { margin: 0 0 10px; }
    .ai-text p:last-child { margin-bottom: 0; }
    .ai-text h1,.ai-text h2,.ai-text h3 { color: #fff; margin: 16px 0 8px; }
    .ai-text ul,.ai-text ol { padding-left: 20px; margin: 8px 0; }
    .ai-text li { margin-bottom: 4px; }
    .ai-text pre {
      background: #1a1a1a; border: 1px solid #333;
      border-radius: 8px; padding: 14px; overflow-x: auto;
      font-size: 13px; margin: 10px 0;
    }
    .ai-text code {
      background: #1a1a1a; border-radius: 4px;
      padding: 2px 5px; font-size: 12px; color: #e2e8f0;
    }
    .ai-text pre code { background: none; padding: 0; }
    .ai-text table {
      border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 13px;
    }
    .ai-text th { background: #1a1a1a; color: #94a3b8; padding: 6px 10px; text-align: left; }
    .ai-text td { border-top: 1px solid #2f2f2f; padding: 5px 10px; }
    .ai-text strong { color: #fff; }

    /* 커서 깜빡임 */
    .cursor-blink::after {
      content: '▌';
      display: inline-block;
      animation: blink 0.8s step-end infinite;
      color: #6366f1;
      margin-left: 1px;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* ── 도구 카드 ── */
    .tool-card {
      background: #1a1a1a;
      border: 1px solid #2f2f2f;
      border-radius: 10px;
      margin: 10px 0;
      overflow: hidden;
    }
    .tool-header {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px;
      background: #222; cursor: pointer;
      user-select: none;
      font-size: 13px;
    }
    .tool-header:hover { background: #2a2a2a; }
    .tool-icon { font-size: 15px; }
    .tool-name { font-weight: 600; color: #a5b4fc; }
    .tool-args { color: #64748b; font-size: 11px; font-family: monospace; margin-left: auto; }
    .tool-status { font-size: 11px; }
    .tool-status.running { color: #f59e0b; }
    .tool-status.done { color: #22c55e; }
    .tool-status.error { color: #ef4444; }
    .tool-body { display: none; padding: 12px 14px; }
    .tool-body.open { display: block; }

    .result-chart { width: 100%; height: 280px; margin-bottom: 6px; }
    .result-table-wrap { max-height: 220px; overflow-y: auto; }
    /* ── 차트 타입 버튼 ── */
    .ct-bar { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 6px; }
    .ct-btn {
      padding: 2px 8px; border-radius: 4px; font-size: 11px; cursor: pointer;
      border: 1px solid #2f2f2f; background: #171717; color: #52525b;
      transition: all 0.12s; white-space: nowrap;
    }
    .ct-btn:hover { background: #2a2a2a; color: #e2e8f0; border-color: #3f3f3f; }
    .ct-btn.ct-active { background: #1e1b4b; border-color: #6366f1; color: #a5b4fc; font-weight: 600; }
    .ct-btn[data-type="sankey"],
    .ct-btn[data-type="heatmap"],
    .ct-btn[data-type="parallel"] { border-color: rgba(34,211,238,.3); color: #22d3ee; }
    .ct-btn[data-type="sankey"].ct-active,
    .ct-btn[data-type="heatmap"].ct-active,
    .ct-btn[data-type="parallel"].ct-active { background: rgba(34,211,238,.12); border-color: #22d3ee; color: #22d3ee; }
    .result-table {
      width: 100%; border-collapse: collapse; font-size: 12px;
    }
    .result-table th {
      position: sticky; top: 0;
      background: #1a1a1a; color: #64748b;
      padding: 5px 10px; text-align: left;
      border-bottom: 1px solid #2f2f2f; white-space: nowrap;
    }
    .result-table td {
      padding: 4px 10px; color: #cbd5e1;
      border-bottom: 1px solid #1e293b; white-space: nowrap;
    }
    .result-table tr:hover td { background: #1e293b; }
    .result-sql {
      background: #111; border-radius: 6px; padding: 10px;
      font-family: monospace; font-size: 11px; color: #4ade80;
      white-space: pre-wrap; word-break: break-all; margin-top: 8px;
    }
    .result-list-item {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 0; border-bottom: 1px solid #1e293b; font-size: 13px;
    }
    .result-list-item:last-child { border: none; }
    .result-list-id {
      width: 28px; text-align: center;
      background: #1e293b; border-radius: 4px;
      font-size: 11px; color: #6366f1; padding: 2px 0; flex-shrink: 0;
    }

    /* ── 생각 중 인디케이터 ── */
    .thinking-indicator {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: #6b7280; padding: 4px 0;
    }
    .thinking-dots { display: flex; gap: 3px; }
    .thinking-dots span {
      width: 5px; height: 5px; border-radius: 50%;
      background: #6366f1; display: block;
      animation: bounce 1.2s infinite;
    }
    .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)} }

    /* ── 입력 영역 ── */
    .input-zone {
      padding: 16px 24px 20px;
      flex-shrink: 0;
    }
    .input-box {
      max-width: 800px;
      margin: 0 auto;
      background: #2f2f2f;
      border: 1px solid #3f3f3f;
      border-radius: 14px;
      display: flex; align-items: flex-end;
      padding: 10px 12px;
      transition: border-color 0.15s;
      gap: 8px;
    }
    .input-box:focus-within { border-color: #6366f1; }
    #user-input {
      flex: 1;
      background: none; border: none; outline: none;
      color: #ececec; font-size: 14px;
      resize: none; max-height: 200px;
      line-height: 1.5; padding: 2px 0;
      font-family: inherit;
      scrollbar-width: thin;
    }
    #user-input::placeholder { color: #5a5a5a; }
    .send-btn {
      width: 34px; height: 34px; border-radius: 8px;
      border: none; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, opacity 0.15s;
    }
    .send-btn.active { background: #6366f1; }
    .send-btn.inactive { background: #3f3f3f; cursor: default; }
    .send-btn.stop { background: #ef4444; }
    .input-hint {
      text-align: center; font-size: 11px; color: #4a4a4a; margin-top: 8px;
      max-width: 800px; margin-left: auto; margin-right: auto;
    }

    /* ── 빈 화면 ── */
    #welcome {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }
    .welcome-icon {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; margin-bottom: 20px;
    }
    .welcome-title { font-size: 24px; font-weight: 600; color: #fff; margin-bottom: 8px; }
    .welcome-sub { font-size: 14px; color: #8a8a8a; line-height: 1.6; margin-bottom: 28px; }
    .example-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px; max-width: 640px; width: 100%;
    }
    .example-grid.cols-3 {
      grid-template-columns: 1fr 1fr 1fr; max-width: 740px;
    }
    .example-card {
      background: #2f2f2f; border: 1px solid #3f3f3f;
      border-radius: 10px; padding: 12px 14px;
      cursor: pointer; text-align: left;
      transition: background 0.15s, border-color 0.15s;
    }
    .example-card:hover { background: #3a3a3a; border-color: #6366f1; }
    .example-card .ex-title { font-size: 13px; font-weight: 500; color: #ececec; margin-bottom: 3px; }
    .example-card .ex-sub { font-size: 11px; color: #6b7280; }

    @media (max-width: 600px) {
      .example-grid { grid-template-columns: 1fr; }
      #sidebar { display: none; }
    }
  </style>
</head>
<body>

<!-- ══ 사이드바 ══════════════════════════════════════════════ -->
<aside id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">T</div>
    <div>
      <div style="font-size:14px;font-weight:600;color:#fff">Trino AI</div>
      <div style="font-size:11px;color:#6b7280">분석 에이전트</div>
    </div>
  </div>

  <!-- 워크스페이스 선택 -->
  <div style="padding:8px 10px;border-bottom:1px solid #2f2f2f">
    <div style="font-size:10px;color:#5a5a5a;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px">워크스페이스</div>
    <div style="display:flex;flex-direction:column;gap:4px" id="agent-ws-selector">
      <button class="agent-ws-btn agent-ws-active" data-ws="tpcds" onclick="switchAgentWorkspace('tpcds')"
              style="padding:7px 10px;border-radius:7px;font-size:12px;cursor:pointer;
                     border:1px solid #334155;background:#1e1b4b;color:#a5b4fc;text-align:left;
                     font-weight:600;transition:all 0.15s">
        📊 TPC-DS sf1 스키마 24개 테이블
      </button>
      <button class="agent-ws-btn" data-ws="army" onclick="switchAgentWorkspace('army')"
              style="padding:7px 10px;border-radius:7px;font-size:12px;cursor:pointer;
                     border:1px solid #374151;background:#111827;color:#6b7280;text-align:left;
                     transition:all 0.15s">
        🎖 육군 국방데이터 온톨로지 분석
      </button>
      <button class="agent-ws-btn" data-ws="scenario" onclick="switchAgentWorkspace('scenario')"
              style="padding:7px 10px;border-radius:7px;font-size:12px;cursor:pointer;
                     border:1px solid #374151;background:#111827;color:#6b7280;text-align:left;
                     transition:all 0.15s">
        🛡 육군 방어 및 대응전략 시뮬레이션
      </button>
    </div>
  </div>

  <div style="display:flex;gap:6px;padding:0 2px;margin-bottom:4px">
    <button class="new-chat-btn" onclick="newChat()" style="flex:1">
      <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
      </svg>
      새 대화
    </button>
    <button onclick="openDataCatalog()"
      style="flex:0 0 auto;padding:7px 10px;border-radius:7px;font-size:11px;cursor:pointer;
             border:1px solid #1e3a5f;background:#0c1a2b;color:#38bdf8;transition:all 0.15s"
      title="데이터 현황 보기">
      📊
    </button>
  </div>

  <div class="conv-list" id="conv-list">
    <!-- JS로 채워짐 -->
  </div>

  <div class="sidebar-footer">
    <div class="model-badge">
      <span class="status-dot checking" id="status-dot"></span>
      <span style="font-size:11px;color:#8a8a8a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" id="model-name">{{ model }}</span>
    </div>
    <div style="margin-top:8px;display:flex;gap:6px">
      <a href="/" style="font-size:11px;color:#6b7280;text-decoration:none;
                         padding:4px 8px;background:#2a2a2a;border-radius:5px;
                         transition:color 0.1s" onmouseover="this.style.color='#ececec'" onmouseout="this.style.color='#6b7280'">
        📊 대시보드
      </a>
    </div>
  </div>
</aside>

<!-- ══ 메인 ══════════════════════════════════════════════════ -->
<main id="main">

  <!-- 상단 바 -->
  <div class="topbar">
    <button class="toggle-btn" onclick="toggleSidebar()" title="사이드바 토글">
      <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
      <select class="model-select" id="model-select" onchange="onModelChange()">
        <optgroup label="── Qwen (한국어 우수·안정)">
          <option value="qwen2.5:3b"   {% if model == 'qwen2.5:3b'   %}selected{% endif %}>Qwen 2.5 3B ★추천</option>
          <option value="qwen3.5:4b"   {% if model == 'qwen3.5:4b'   %}selected{% endif %}>Qwen 3.5 4B (최신·고품질)</option>
          <option value="qwen3.5:9b"   {% if model == 'qwen3.5:9b'   %}selected{% endif %}>Qwen 3.5 9B (최고 품질)</option>
          <option value="qwen2.5:1.5b" {% if model == 'qwen2.5:1.5b' %}selected{% endif %}>Qwen 2.5 1.5B (초경량)</option>
        </optgroup>
        <optgroup label="── EEVE Korean (한국어 특화)">
          <option value="EEVE-Korean-10.8B:latest" {% if model == 'EEVE-Korean-10.8B:latest' %}selected{% endif %}>EEVE Korean 10.8B</option>
        </optgroup>
        <optgroup label="── EXAONE (LG AI, Ollama 최신 필요)">
          <option value="sam860/exaone-4.0:1.2b" {% if model == 'sam860/exaone-4.0:1.2b' %}selected{% endif %}>EXAONE 4.0 1.2B</option>
        </optgroup>
        <optgroup label="── Meta Llama">
          <option value="llama3.1:8b"  {% if model == 'llama3.1:8b'  %}selected{% endif %}>Llama 3.1 8B</option>
          <option value="llama3.2:3b"  {% if model == 'llama3.2:3b'  %}selected{% endif %}>Llama 3.2 3B</option>
          <option value="llama3.2:1b"  {% if model == 'llama3.2:1b'  %}selected{% endif %}>Llama 3.2 1B (경량)</option>
        </optgroup>
        <optgroup label="── Mistral">
          <option value="mistral:7b"   {% if model == 'mistral:7b'   %}selected{% endif %}>Mistral 7B</option>
        </optgroup>
        <optgroup label="── Google Gemma">
          <option value="gemma:7b"     {% if model == 'gemma:7b'     %}selected{% endif %}>Gemma 7B</option>
        </optgroup>
      </select>
    <div style="margin-left:auto;display:flex;gap:8px">
      <span id="gen-status" style="font-size:12px;color:#6b7280"></span>
    </div>
  </div>

  <!-- 채팅 스크롤 영역 -->
  <div id="chat-scroll">
    <!-- 환영 화면 (내용은 renderWelcomeScreen() 으로 동적 생성) -->
    <div id="welcome">
      <div class="welcome-icon"></div>
      <div class="welcome-title"></div>
      <div class="welcome-sub"></div>
      <div class="example-grid" id="example-grid"></div>
    </div>

    <!-- 메시지는 JS로 #chat-inner에 추가 -->

let statusTimer;
async function checkStatus() {
  const dot  = document.getElementById('status-dot');
  const name = document.getElementById('model-name');
  dot.className = 'status-dot checking';
  try {
    const r = await fetch('/api/llm/status');
    const d = await r.json();
    if (d.ok) {
      dot.className = d.model_loaded ? 'status-dot online' : 'status-dot checking';
      name.textContent = state.model + (d.model_loaded ? '' : ' (로딩 중)');
    } else throw new Error(d.error);
  } catch {
    dot.className = 'status-dot offline';
    name.textContent = 'Ollama 연결 안됨';
  }
}
checkStatus();
statusTimer = setInterval(checkStatus, 30000);

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
}

function renderConvList() {
  const el = document.getElementById('conv-list');
  const convs = state.conversations.slice().reverse();
  if (!convs.length) {
    el.innerHTML = '<div style="padding:16px 10px;font-size:12px;color:#4a4a4a;text-align:center">대화 내역 없음</div>';
    return;
  }
  el.innerHTML = `<div class="conv-group-label">최근 대화</div>` +
    convs.map(c => `
      <div class="conv-item ${c.id === state.currentId ? 'active' : ''}"
           onclick="loadConv('${c.id}')"
           title="${esc(c.title)}">
        ${esc(c.title || '새 대화')}
      </div>
    `).join('');
}

function saveConversations() {
  localStorage.setItem('trino_conversations', JSON.stringify(state.conversations));
}

function newChat() {
  state.currentId = null;
  renderWelcomeScreen(state.workspace);          // 현재 워크스페이스 예시 카드 갱신
  document.getElementById('welcome').style.display   = 'flex';
  document.getElementById('chat-inner').style.display = 'none';
  document.getElementById('chat-inner').innerHTML     = '';
  renderConvList();
  document.getElementById('user-input').focus();
}

function loadConv(id) {
  const conv = state.conversations.find(c => c.id === id);
  if (!conv) return;
  state.currentId = id;

  document.getElementById('welcome').style.display = 'none';
  const ci = document.getElementById('chat-inner');
  ci.style.display = 'block';
  ci.innerHTML = '';

  conv.messages.forEach(msg => {
    if (msg.role === 'user') {
      appendUserMsg(msg.content, false);
    } else if (msg.role === 'assistant') {
      const row = appendAiRow();
      setAiContent(row, msg.content, msg.toolCards || []);
    }
  });
  renderConvList();
  scrollToBottom();
}

function getCurrentConv() {
  if (!state.currentId) return null;
  return state.conversations.find(c => c.id === state.currentId) || null;
}

function ensureConv(firstUserMsg) {
  if (state.currentId) return;
  const id = Date.now().toString();
  state.currentId = id;
  const title = firstUserMsg.slice(0, 40) + (firstUserMsg.length > 40 ? '...' : '');
  state.conversations.push({ id, title, messages: [] });
  saveConversations();
  renderConvList();
}

function appendUserMsg(text, scroll = true) {
  const ci = document.getElementById('chat-inner');
  ci.style.display = 'block';
  document.getElementById('welcome').style.display = 'none';

  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `
    <div class="avatar user">나</div>
    <div class="msg-content">
      <div class="user-bubble">${esc(text)}</div>
    </div>
  `;
  ci.appendChild(row);
  if (scroll) scrollToBottom();
  return row;
}

function appendAiRow() {
  const ci = document.getElementById('chat-inner');
  const row = document.createElement('div');
  row.className = 'msg-row';
  row.innerHTML = `
    <div class="avatar ai">AI</div>
    <div class="msg-content">
      <div class="ai-text" id="ai-text-${Date.now()}"></div>
    </div>
  `;
  ci.appendChild(row);
  scrollToBottom();
  return row;
}

let chartCounter = 0;

// ════════════════════════════════════════════════════════
//  차트 타입 전환 (공유)
// ════════════════════════════════════════════════════════
const _chartStore = {};

const CT_TYPES = [
  { key: 'bar',        label: '📊 막대' },
  { key: 'horizontal', label: '↔ 가로막대' },
  { key: 'line',       label: '📈 라인' },
  { key: 'area',       label: '🌊 영역' },
  { key: 'pie',        label: '🥧 파이' },
  { key: 'scatter',    label: '⬤ 산점도' },
  { key: 'sankey',     label: '🔗 생키',     adv: true },
  { key: 'heatmap',    label: '🌡 밀도맵',   adv: true },
  { key: 'parallel',   label: '📐 평행좌표', adv: true },
];
const ADV_TYPES = new Set(['sankey','heatmap','parallel']);

function detectInitType(chartData) {
  if (!chartData?.data?.[0]) return 'bar';
  const t = chartData.data[0];
  if (t.type === 'pie') return 'pie';
  if (t.orientation === 'h') return 'horizontal';
  if (t.type === 'scatter') {
    if (t.fill) return 'area';
    return (t.mode || '').includes('lines') ? 'line' : 'scatter';
  }
  return 'bar';
}

function _buildTrace(type, xVals, yVals) {
  const COLORS = {
    bar: '#6366f1', line: '#22d3ee', area: '#6366f1',
    scatter: '#f59e0b', horizontal: '#8b5cf6',
  };
  if (type === 'pie') {
    return {
      type: 'pie', labels: xVals, values: yVals, hole: 0.38,
      textinfo: 'label+percent', hoverinfo: 'label+value+percent',
      marker: { colors: ['#6366f1','#8b5cf6','#22d3ee','#f59e0b','#10b981','#ef4444',
                          '#f97316','#06b6d4','#84cc16','#e879f9','#fb7185','#34d399'] },
    };
  }
  if (type === 'line') {
    return { type: 'scatter', mode: 'lines+markers', x: xVals, y: yVals,
             line: { color: COLORS.line, width: 2 }, marker: { size: 6, color: COLORS.line } };
  }
  if (type === 'area') {
    return { type: 'scatter', mode: 'lines', x: xVals, y: yVals, fill: 'tozeroy',
             line: { color: COLORS.area, width: 2 }, fillcolor: 'rgba(99,102,241,0.15)' };
  }
  if (type === 'scatter') {
    return { type: 'scatter', mode: 'markers', x: xVals, y: yVals,
             marker: { color: COLORS.scatter, size: 9, opacity: 0.8 } };
  }
  if (type === 'horizontal') {
    return { type: 'bar', orientation: 'h', y: xVals, x: yVals,
             marker: { color: COLORS.horizontal } };
  }
  return { type: 'bar', x: xVals, y: yVals, marker: { color: COLORS.bar } };
}

function _buildLayout(type, n) {
  const isPie = type === 'pie';
  const isH   = type === 'horizontal';
  const angle  = n > 15 ? -45 : (n > 6 ? -30 : 0);
  const bMgn   = n > 15 ? 140 : (n > 6 ? 100 : 50);
  const base = {
    paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
    font: { color: '#94a3b8', size: 11 },
    showlegend: isPie,
    margin: isPie ? { l:10, r:10, t:10, b:10 }
            : isH  ? { l:110, r:10, t:10, b:30 }
            : { l:45, r:10, t:10, b: bMgn },
  };
  if (!isPie) {
    base.xaxis = { gridcolor: '#1e293b', tickfont: { color: '#94a3b8', size: 10 }, tickangle: isH ? 0 : angle };
    base.yaxis = { gridcolor: '#1e293b', tickfont: { color: '#94a3b8', size: 10 } };
  }
  return base;
}

function changeChartType(chartId, newType) {
  const s = _chartStore[chartId];
  if (!s) return;
  s.current = newType;
  document.querySelectorAll(`[data-cid="${chartId}"]`).forEach(b =>
    b.classList.toggle('ct-active', b.dataset.type === newType));
  const el = document.getElementById(chartId);
  if (!el) return;
  if (ADV_TYPES.has(newType)) {
    renderAdvancedChart(newType, el, s.columns||[], s.rows||[]);
    return;
  }
  el.innerHTML = '';
  const trace  = _buildTrace(newType, s.x, s.y);
  const layout = _buildLayout(newType, s.x.length);
  Plotly.newPlot(chartId, [trace], layout, { responsive: true, displayModeBar: true,
    modeBarButtonsToRemove: ['sendDataToCloud'] });
}

function renderAdvancedChart(type, el, columns, rows) {
  if (typeof Plotly !== 'undefined') try { Plotly.purge(el.id); } catch(e) {}
  el.innerHTML = '';
  el.style.cssText += ';background:#0a1628;border-radius:8px;overflow:hidden';
  if (!rows||rows.length===0) {
    el.innerHTML='<p style="color:#64748b;text-align:center;padding:20px;font-size:12px">데이터가 없어 고급 시각화를 표시할 수 없습니다.</p>'; return;
  }
  if (type==='sankey')   _advSankey(el, columns, rows);
  if (type==='heatmap')  _advHeatmap(el, columns, rows);
  if (type==='parallel') _advParallel(el, columns, rows);
}

function _advSankey(el, columns, rows) {
  if (!window.d3||!d3.sankey) { el.innerHTML='<p style="color:#f97316;text-align:center;padding:20px">d3-sankey 로드 중...</p>'; return; }
  const W=el.clientWidth||500, H=el.clientHeight||280;
  const colMeta=columns.map((c,i)=>({ i, name:c, isNum: rows.filter(r=>r[i]!==null&&r[i]!=='').every(r=>!isNaN(Number(r[i]))) }));
  const strIdx=colMeta.filter(c=>!c.isNum).map(c=>c.i);
  const numIdx=colMeta.filter(c=>c.isNum).map(c=>c.i);
  if (strIdx.length<2||numIdx.length<1) {
    el.innerHTML='<p style="color:#64748b;text-align:center;padding:20px;font-size:11px">생키는 [출발지, 도착지, 값] 컬럼 형태가 필요합니다.</p>'; return;
  }
  const [si,ti,vi]=[strIdx[0],strIdx[1],numIdx[0]];
  const nodeSet=new Set(); rows.forEach(r=>{nodeSet.add(String(r[si]));nodeSet.add(String(r[ti]));});
  const nodeList=[...nodeSet]; const nodeMap=new Map(nodeList.map((n,i)=>[n,i]));
  const nodes=nodeList.map(name=>({name}));
  const links=rows.map(r=>({source:nodeMap.get(String(r[si])),target:nodeMap.get(String(r[ti])),value:Math.max(.01,Number(r[vi])||1)})).filter(l=>l.source!==undefined&&l.target!==undefined&&l.source!==l.target);
  const COLORS=['#22d3ee','#10b981','#8b5cf6','#f97316','#ef4444','#eab308'];
  const svg=d3.select(el).append('svg').attr('width',W).attr('height',H);
  const mg={t:10,r:100,b:10,l:100};
  const g=svg.append('g').attr('transform',`translate(${mg.l},${mg.t})`);
  const layout=d3.sankey().nodeWidth(16).nodePadding(8).extent([[0,0],[W-mg.l-mg.r,H-mg.t-mg.b]])
    ({nodes:nodes.map(d=>({...d})),links:links.map(d=>({...d}))});
  g.append('g').selectAll('path').data(layout.links).join('path').attr('d',d3.sankeyLinkHorizontal())
    .attr('fill','none').attr('stroke',d=>COLORS[d.source.index%COLORS.length])
    .attr('stroke-width',d=>Math.max(1,d.width)).attr('opacity',.32);
  const ng=g.append('g').selectAll('g').data(layout.nodes).join('g');
  ng.append('rect').attr('x',d=>d.x0).attr('y',d=>d.y0).attr('width',d=>d.x1-d.x0).attr('height',d=>Math.max(2,d.y1-d.y0)).attr('fill',(_,i)=>COLORS[i%COLORS.length]).attr('rx',2);
  ng.append('text').attr('x',d=>d.x0<(W-mg.l-mg.r)/2?d.x1+5:d.x0-5).attr('y',d=>(d.y0+d.y1)/2).attr('dy','0.35em').attr('text-anchor',d=>d.x0<(W-mg.l-mg.r)/2?'start':'end').attr('fill','#cbd5e1').attr('font-size',9).text(d=>`${d.name} (${(d.value||0).toLocaleString()})`);
}

function _advHeatmap(el, columns, rows) {
  const W=el.clientWidth||500, H=el.clientHeight||280;
  const canvas=Object.assign(document.createElement('canvas'),{width:W,height:H});
  canvas.style.cssText='display:block;width:100%;height:100%'; el.appendChild(canvas);
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#0a1628'; ctx.fillRect(0,0,W,H);
  const mg={t:36,r:12,b:14,l:80}; const dispR=Math.min(rows.length,35);
  const cW=(W-mg.l-mg.r)/columns.length, cH=(H-mg.t-mg.b)/dispR;
  const nums=rows.flatMap(r=>r.map(v=>Number(v)).filter(v=>!isNaN(v)));
  const [minV,maxV]=[Math.min(...nums)||0,Math.max(...nums)||1];
  const norm=v=>(v-minV)/(maxV-minV||1);
  const heat=t=>{const stops=[[0,[8,20,110]],[.3,[0,80,240]],[.55,[0,200,160]],[.75,[220,220,0]],[1,[255,30,0]]];for(let i=0;i<stops.length-1;i++){const[t0,c0]=stops[i],[t1,c1]=stops[i+1];if(t>=t0&&t<=t1){const f=(t-t0)/(t1-t0);return c0.map((v,j)=>Math.round(v+f*(c1[j]-v)));}}return[255,0,0];};
  rows.slice(0,dispR).forEach((row,ri)=>{
    columns.forEach((col,ci)=>{
      const v=Number(row[ci]),t=isNaN(v)?0:norm(v);const[r,g,b]=heat(t);
      ctx.fillStyle=`rgb(${r},${g},${b})`;ctx.fillRect(mg.l+ci*cW+1,mg.t+ri*cH+1,cW-2,cH-2);
      if(cW>26&&cH>11&&!isNaN(v)){ctx.fillStyle=t>.55?'rgba(0,0,0,.8)':'rgba(255,255,255,.85)';ctx.font=`${Math.min(9,cH-3)}px monospace`;ctx.textAlign='center';ctx.fillText(v%1===0?v:v.toFixed(1),mg.l+ci*cW+cW/2,mg.t+ri*cH+cH/2+3);}
    });
    ctx.fillStyle='#64748b';ctx.font='8px monospace';ctx.textAlign='right';ctx.fillText(String(row[0]).slice(0,10),mg.l-4,mg.t+ri*cH+cH/2+3);
  });
  columns.forEach((col,ci)=>{ctx.save();ctx.translate(mg.l+ci*cW+cW/2,mg.t-5);ctx.rotate(-Math.PI/5);ctx.fillStyle='#94a3b8';ctx.font='8px monospace';ctx.textAlign='left';ctx.fillText(col.slice(0,12),0,0);ctx.restore();});
}

function _advParallel(el, columns, rows) {
  if (!window.d3){el.innerHTML='<p style="color:#f97316;text-align:center;padding:20px">D3 로드 중...</p>';return;}
  const W=el.clientWidth||500,H=el.clientHeight||280;
  const colMeta=columns.map((c,i)=>({i,name:c,isNum:rows.filter(r=>r[i]!==null&&r[i]!=='').every(r=>!isNaN(Number(r[i])))}));
  const numDims=colMeta.filter(c=>c.isNum); const catCol=colMeta.find(c=>!c.isNum);
  if(numDims.length<2){el.innerHTML='<p style="color:#64748b;text-align:center;padding:20px;font-size:11px">평행좌표는 수치형 컬럼 2개 이상이 필요합니다.</p>';return;}
  const data=rows.slice(0,250).map(r=>({...Object.fromEntries(numDims.map(d=>[d.name,Number(r[d.i])])),_cat:catCol?String(r[catCol.i]):'데이터'}));
  const cats=[...new Set(data.map(d=>d._cat))];
  const COLORS=['#22d3ee','#10b981','#ef4444','#f97316','#8b5cf6','#eab308'];
  const colorOf=d=>COLORS[cats.indexOf(d._cat)%COLORS.length];
  const dims=numDims.map(d=>d.name);
  const mg={t:32,r:16,b:22,l:16};
  const iW=W-mg.l-mg.r,iH=H-mg.t-mg.b;
  const xSc=d3.scalePoint().domain(dims).range([0,iW]).padding(.1);
  const ySc={};dims.forEach(d=>{ySc[d]=d3.scaleLinear().domain(d3.extent(data,v=>v[d])).range([iH,0]).nice();});
  const pathFn=row=>d3.line()(dims.map(d=>[xSc(d),ySc[d](row[d])]));
  d3.select(el).selectAll('*').remove();
  const svg=d3.select(el).append('svg').attr('width',W).attr('height',H);
  const g=svg.append('g').attr('transform',`translate(${mg.l},${mg.t})`);
  g.append('g').selectAll('path').data(data).join('path').attr('d',pathFn).attr('fill','none').attr('stroke',colorOf).attr('stroke-width',.8).attr('opacity',.15);
  const fg=g.append('g').selectAll('path').data(data).join('path').attr('d',pathFn).attr('fill','none').attr('stroke',colorOf).attr('stroke-width',1.3).attr('opacity',.48);
  const active={};
  function upd(){const hasF=Object.keys(active).length>0;fg.attr('opacity',d=>{if(!hasF)return .48;const p=Object.entries(active).every(([dim,[lo,hi]])=>d[dim]>=lo&&d[dim]<=hi);return p?.75:.04;}).attr('stroke-width',d=>{if(!hasF)return 1.3;const p=Object.entries(active).every(([dim,[lo,hi]])=>d[dim]>=lo&&d[dim]<=hi);return p?2:.5;});}
  dims.forEach(dim=>{
    const ag=g.append('g').attr('transform',`translate(${xSc(dim)},0)`);
    ag.call(d3.axisLeft(ySc[dim]).ticks(4)).selectAll('text').attr('fill','#64748b').attr('font-size',8).attr('font-family','monospace');
    ag.selectAll('line,path').attr('stroke','#1e3a5f');
    ag.append('text').attr('y',-12).attr('text-anchor','middle').attr('fill','#cbd5e1').attr('font-size',9).attr('font-weight',600).text(dim.length>6?dim.slice(0,6)+'…':dim);
    ag.append('g').attr('class','brush').call(d3.brushY().extent([[-11,0],[11,iH]]).on('brush end',function(ev){if(ev.selection){const[p2,p1]=ev.selection;active[dim]=[ySc[dim].invert(p2),ySc[dim].invert(p1)].sort((a,b)=>a-b);}else delete active[dim];upd();})).selectAll('.selection').attr('fill','rgba(34,211,238,.18)').attr('stroke','#22d3ee');
  });
}

function setAiContent(row, markdownText, toolCards = []) {

  if (!textEl) return;

  // 도구 카드 먼저
  toolCards.forEach(tc => {

  });

  // 마크다운 텍스트
  if (markdownText) {

function buildToolCard(tc, startOpen = true) {
  const result = tc.result || {};
  const hasError = !!result.error;
  const isRunAnalysis = result.tool === 'run_analysis';
  const isRunSql = result.tool === 'run_sql';
  const isList = result.tool === 'list_analyses';

  const toolNameMap = {
    run_analysis: '📊 분석 실행',
    run_sql: '🔍 SQL 실행',
    list_analyses: '📋 분석 목록',
  };
  const displayName = toolNameMap[tc.name] || tc.name;
  const argsStr = Object.entries(tc.args || {}).map(([k,v]) => `${k}=${v}`).join(', ');
  const statusClass = hasError ? 'error' : 'done';
  const statusText = hasError ? '오류' : '완료';

  const cardId = `tc-${Date.now()}-${++chartCounter}`;
  const bodyId = `tb-${cardId}`;
  const chartId = `chart-${cardId}`;

  // cols/rows를 함수 스코프로 선언 — setTimeout 클로저에서 접근 가능하도록
  let cols = [];
  let rows = [];
  let bodyHtml = '';

  if (hasError) {
    bodyHtml = `<div style="color:#ef4444;font-size:13px">⚠️ ${esc(result.error)}</div>`;
  } else if (isList) {
    const items = (result.data || []).map(a => `
      <div class="result-list-item">
        <span class="result-list-id">${esc(a.id)}</span>
        <span style="font-weight:500;color:#ececec;font-size:13px">${esc(a.name)}</span>
        <span style="color:#64748b;font-size:11px;margin-left:auto">${esc(a.description.slice(0,35))}...</span>
      </div>
    `).join('');
    bodyHtml = `<div>${items}</div>`;
  } else if (result.html_viz) {
    // html_viz: iframe 렌더링
    const analysis = result.analysis || {};
    bodyHtml = `
      <div style="margin-bottom:8px;font-size:11px;color:#86efac">
        ✦ ${esc(analysis.description || analysis.name || '고급 시각화')}
      </div>
      <iframe
        src="${esc(result.viz_url)}"
        style="width:100%;height:480px;border:none;border-radius:8px;background:#0a1628;display:block"
        loading="lazy"
        sandbox="allow-scripts allow-same-origin"
        title="${esc(analysis.name || '')}">
      </iframe>
      <p style="font-size:10px;color:#475569;margin-top:5px;font-family:monospace">
        ↗ 새 탭에서 보기:
        <a href="${esc(result.viz_url)}" target="_blank" style="color:#38bdf8">${esc(result.viz_url)}</a>
      </p>`;
  } else {
    cols = result.columns || [];
    rows = result.rows || [];
    const sql   = result.sql || '';
    const chart = result.chart;

    if (chart) {
      const chartH   = rows.length > 15 ? 380 : 280;
      const initType = detectInitType(chart);
      const ctBtns   = CT_TYPES.map(t =>
        `<button class="ct-btn${t.key === initType ? ' ct-active' : ''}"
                 data-cid="${chartId}" data-type="${t.key}"
                 onclick="changeChartType('${chartId}','${t.key}')">${t.label}</button>`
      ).join('');
      bodyHtml += `<div class="ct-bar">${ctBtns}</div>`;
      bodyHtml += `<div id="${chartId}" class="result-chart" style="height:${chartH}px"></div>`;
    }
    if (rows.length) {
      bodyHtml += `
        <div style="margin-bottom:6px;font-size:11px;color:#64748b">${rows.length}행 반환</div>
        <div class="result-table-wrap">
          <table class="result-table">
            <thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>
            <tbody>${rows.map(r =>
              `<tr>${r.map(v => `<td>${v === null ? '<span style="color:#475569">NULL</span>' : esc(String(v))}</td>`).join('')}</tr>`
            ).join('')}</tbody>
          </table>
        </div>`;
    }
    if (sql) {
      bodyHtml += `
        <details style="margin-top:8px">
          <summary style="cursor:pointer;font-size:11px;color:#64748b;user-select:none">SQL 보기</summary>
          <div class="result-sql">${esc(sql)}</div>
        </details>`;
    }
    if (!rows.length && !chart) {
      bodyHtml += `<div style="color:#64748b;font-size:13px">결과 없음</div>`;
    }
  }

  const div = document.createElement('div');
  div.className = 'tool-card';
  div.innerHTML = `
    <div class="tool-header" onclick="toggleToolBody('${bodyId}')">
      <span class="tool-icon">${displayName.split(' ')[0]}</span>
      <span class="tool-name">${displayName.split(' ').slice(1).join(' ')}</span>
      <span class="tool-args">${esc(argsStr)}</span>
      <span class="tool-status ${statusClass}">${statusText}</span>
      <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-left:4px;color:#6b7280">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
      </svg>
    </div>
    <div class="tool-body ${startOpen ? 'open' : ''}" id="${bodyId}">
      ${bodyHtml}
    </div>
  `;

  // 차트 렌더링 + 스토어 초기화 (DOM 추가 후)
  // tool-body가 display:none 상태일 수 있으므로 open 클래스 강제 적용 후 렌더링
  setTimeout(() => {
    const chart = result.chart;
    const chartEl = document.getElementById(chartId);
    if (chart && chartEl) {
      // 부모 tool-body가 닫혀 있으면 잠시 열어서 Plotly가 크기를 계산할 수 있게 함
      const bodyEl = document.getElementById(bodyId);
      const wasHidden = bodyEl && !bodyEl.classList.contains('open');
      if (wasHidden && bodyEl) bodyEl.classList.add('open');

      const trace0 = chart.data[0] || {};
      const xVals  = trace0.x || trace0.labels || [];
      const yVals  = trace0.y || trace0.values || [];
      _chartStore[chartId] = { x: xVals, y: yVals, current: detectInitType(chart), columns: cols, rows };
      Plotly.newPlot(chartId, chart.data, chart.layout, {
        responsive: true, displayModeBar: true,
        modeBarButtonsToRemove: ['sendDataToCloud'],
      });

      // 원래 닫혀 있던 경우 다시 닫기
      if (wasHidden && bodyEl) bodyEl.classList.remove('open');
    }
  }, 100);

  return div;
}

function toggleToolBody(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.toggle('open');
  // 열릴 때 Plotly 차트 크기 재계산
  if (el.classList.contains('open')) {
    el.querySelectorAll('.result-chart').forEach(chartEl => {
      if (chartEl.id && typeof Plotly !== 'undefined') {
        try { Plotly.Plots.resize(chartEl); } catch(e) {}
      }
    });
  }
}

async function sendMessage() {
  if (state.generating) {
    stopGeneration();
    return;
  }
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if (!text) return;

  // 한국어 IME 잔류 방지: blur → clear → setTimeout으로 compositionend 완료 보장
  _isComposing = false;
  input.blur();
  input.value = '';
  autoResize(input);
  updateSendBtn();
  // 다음 입력을 위해 포커스 복원 (setTimeout으로 IME 완료 후)
  setTimeout(() => input.focus(), 10);

  ensureConv(text);
  const conv = getCurrentConv();

  // 대화 기록에 사용자 메시지 추가
  conv.messages.push({ role: 'user', content: text });
  saveConversations();

  appendUserMsg(text);

  // AI 메시지 행 준비
  const aiRow = appendAiRow();
  const textEl = aiRow.querySelector('.ai-text');
  textEl.classList.add('cursor-blink');

  // "생각 중" 표시
  const thinkingEl = document.createElement('div');
  thinkingEl.className = 'thinking-indicator';
  thinkingEl.innerHTML = `
    <div class="thinking-dots">
      <span></span><span></span><span></span>
    </div>
    <span>분석 중...</span>
  `;
  textEl.appendChild(thinkingEl);

  setGenerating(true);

  // API 메시지 형식
  const apiMessages = conv.messages
    .filter(m => m.role === 'user' || m.role === 'assistant')
    .map(m => ({ role: m.role, content: m.content }));

  const model = document.getElementById('model-select').value;

  let fullText = '';
  const toolCards = [];
  let currentToolCard = null;

  state.abortCtrl = new AbortController();

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: apiMessages, model, workspace: state.workspace }),
      signal: state.abortCtrl.signal,
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      const lines = buf.split('\n');
      buf = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let evt;
        try { evt = JSON.parse(line.slice(6)); } catch { continue; }

        if (evt.type === 'thinking') {
          // 이미 thinking indicator 표시 중
        } else if (evt.type === 'token') {
          if (thinkingEl.parentNode) thinkingEl.remove();
          fullText += evt.content;
          // 실시간 마크다운 렌더 (마지막 도구 카드 이후에 추가)
          updateStreamText(textEl, toolCards, fullText);
          scrollToBottom();
        } else if (evt.type === 'tool_start') {
          if (thinkingEl.parentNode) thinkingEl.remove();
          currentToolCard = { name: evt.name, args: evt.args, result: null };
          // 실행 중 카드 표시
          const pendingCard = buildPendingToolCard(evt.name, evt.args);
          textEl.appendChild(pendingCard);
          currentToolCard._pendingEl = pendingCard;
          scrollToBottom();
        } else if (evt.type === 'tool_result') {
          if (currentToolCard) {
            currentToolCard.result = evt.result;
            if (currentToolCard._pendingEl) {
              currentToolCard._pendingEl.remove();
            }
            const card = buildToolCard(currentToolCard, true);
            textEl.appendChild(card);
            toolCards.push(currentToolCard);
            currentToolCard = null;
          }
          scrollToBottom();
        } else if (evt.type === 'done') {
          break;
        } else if (evt.type === 'error') {
          if (thinkingEl.parentNode) thinkingEl.remove();
          const errEl = document.createElement('div');
          errEl.style.cssText = 'color:#ef4444;font-size:13px;margin-top:8px';
          errEl.textContent = `⚠️ ${evt.message}`;
          textEl.appendChild(errEl);
          break;
        }
      }
    }
  } catch (err) {
    if (err.name !== 'AbortError') {
      if (thinkingEl.parentNode) thinkingEl.remove();
      const errEl = document.createElement('div');
      errEl.style.cssText = 'color:#ef4444;font-size:13px';
      errEl.textContent = `⚠️ 연결 오류: ${err.message}`;
      textEl.appendChild(errEl);
    }
  }

  textEl.classList.remove('cursor-blink');
  if (thinkingEl.parentNode) thinkingEl.remove();

  // 대화 기록 저장
  conv.messages.push({ role: 'assistant', content: fullText, toolCards });
  saveConversations();

  setGenerating(false);
  scrollToBottom();
}

function buildPendingToolCard(name, args) {
  const toolNameMap = {
    run_analysis: '📊 분석 실행',
    run_sql: '🔍 SQL 실행',
    list_analyses: '📋 분석 목록',
  };
  const displayName = toolNameMap[name] || name;
  const argsStr = Object.entries(args || {}).map(([k,v]) => `${k}=${v}`).join(', ');

  const div = document.createElement('div');
  div.className = 'tool-card';
  div.innerHTML = `
    <div class="tool-header">
      <span class="tool-icon">${displayName.split(' ')[0]}</span>
      <span class="tool-name">${displayName.split(' ').slice(1).join(' ')}</span>
      <span class="tool-args">${esc(argsStr)}</span>
      <span class="tool-status running" style="display:flex;align-items:center;gap:5px">
        <span class="thinking-dots" style="display:inline-flex;gap:2px">
          <span style="width:4px;height:4px;border-radius:50%;background:#f59e0b;display:block;animation:bounce 1.2s infinite"></span>
          <span style="width:4px;height:4px;border-radius:50%;background:#f59e0b;display:block;animation:bounce 1.2s 0.2s infinite"></span>
          <span style="width:4px;height:4px;border-radius:50%;background:#f59e0b;display:block;animation:bounce 1.2s 0.4s infinite"></span>
        </span>
        실행 중
      </span>
    </div>
  `;
  return div;
}

let _lastStreamId = null;

}

// ════════════════════════════════════════════════════════
//  UI 유틸
// ════════════════════════════════════════════════════════
function stopGeneration() {
  if (state.abortCtrl) state.abortCtrl.abort();
  setGenerating(false);
}

function setGenerating(on) {
  state.generating = on;
  const btn = document.getElementById('send-btn');
  const status = document.getElementById('gen-status');
  if (on) {
    btn.className = 'send-btn stop';
    btn.title = '생성 중지';
    btn.innerHTML = `<svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>`;
    status.textContent = '생성 중...';
  } else {
    updateSendBtn();
    btn.title = '전송';
    btn.innerHTML = `<svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>`;
    status.textContent = '';
  }
}

function updateSendBtn() {
  if (state.generating) return;
  const btn = document.getElementById('send-btn');
  const hasText = document.getElementById('user-input').value.trim().length > 0;
  btn.className = `send-btn ${hasText ? 'active' : 'inactive'}`;
}

// 한국어 IME 조합 상태 추적
let _isComposing = false;
document.getElementById('user-input').addEventListener('compositionstart', () => { _isComposing = true; });
document.getElementById('user-input').addEventListener('compositionend',   () => { _isComposing = false; });

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    // IME 조합 중(한글 입력 완성 전)에는 전송하지 않음
    if (_isComposing) return;
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 200) + 'px';
}

function scrollToBottom() {
  const cs = document.getElementById('chat-scroll');
  cs.scrollTop = cs.scrollHeight;
}

function useExample(text, analysisId) {
  // html_viz 분석 (SV1/SV2/SV3)은 LLM을 거치지 않고 직접 실행
  if (analysisId) {
    runAnalysisViz(analysisId, text);
    return;
  }
  const inp = document.getElementById('user-input');
  inp.blur();
  inp.value = text;
  autoResize(inp);
  updateSendBtn();
  sendMessage();
}

// html_viz 타입 분석을 직접 실행해서 iframe으로 렌더링
async function runAnalysisViz(analysisId, label) {
  ensureConv(label);
  appendUserMsg(label);

  // 로딩 카드 삽입
  const aiRow = appendAiRow();
  const textEl = aiRow.querySelector('.ai-text');
  textEl.classList.add('cursor-blink');
  const thinkingEl = document.createElement('div');
  thinkingEl.className = 'thinking-indicator';
  thinkingEl.innerHTML = `<div class="thinking-dots"><span></span><span></span><span></span></div><span>시각화 로딩 중...</span>`;
  textEl.appendChild(thinkingEl);
  scrollToBottom();

  try {
    const resp = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: analysisId, workspace: state.workspace }),
    });
    const data = await resp.json();
    thinkingEl.remove();
    textEl.classList.remove('cursor-blink');

    if (data.error) {
      const errEl = document.createElement('div');
      errEl.style.cssText = 'color:#ef4444;font-size:13px';
      errEl.textContent = `⚠️ ${data.error}`;
      textEl.appendChild(errEl);
    } else if (data.type === 'html_viz') {
      const analysis = data.analysis || {};
      const card = document.createElement('div');
      card.className = 'tool-card';
      card.innerHTML = `
        <div class="tool-header" onclick="toggleToolBody('viz-body-${analysisId}')">
          <span class="tool-icon">🎯</span>
          <span class="tool-name">고급 시각화 실행</span>
          <span class="tool-args">${esc(analysis.id || '')} ${esc(analysis.name || '')}</span>
          <span class="tool-status done">완료</span>
          <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-left:4px;color:#6b7280">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </div>
        <div class="tool-body open" id="viz-body-${analysisId}">
          <div style="margin-bottom:8px;font-size:11px;color:#86efac">
            ✦ ${esc(analysis.description || analysis.name || '')}
          </div>
          <iframe
            src="${esc(data.viz_url)}"
            style="width:100%;height:480px;border:none;border-radius:8px;background:#0a1628;display:block"
            loading="lazy"
            sandbox="allow-scripts allow-same-origin"
            title="${esc(analysis.name || '')}">
          </iframe>
          <p style="font-size:10px;color:#475569;margin-top:5px;font-family:monospace">
            ↗ 새 탭에서 보기:
            <a href="${esc(data.viz_url)}" target="_blank" style="color:#38bdf8">${esc(data.viz_url)}</a>
          </p>
        </div>
      `;
      textEl.appendChild(card);
    }
  } catch (e) {
    thinkingEl.remove();
    textEl.classList.remove('cursor-blink');
    const errEl = document.createElement('div');
    errEl.style.cssText = 'color:#ef4444;font-size:13px';
    errEl.textContent = `⚠️ 요청 실패: ${e.message}`;
    textEl.appendChild(errEl);
  }
  scrollToBottom();
}

function onModelChange() {
  const sel = document.getElementById('model-select');
  state.model = sel.value;
  document.getElementById('current-model-hint').textContent = sel.options[sel.selectedIndex].text;
  checkStatus();
}

function esc(str) {
  return String(str ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ════════════════════════════════════════════════════════
//  초기화
// ════════════════════════════════════════════════════════
renderWelcomeScreen(state.workspace);
renderConvList();
document.getElementById('user-input').focus();

// ════════════════════════════════════════════════════════
//  데이터 현황 모달
// ════════════════════════════════════════════════════════
let _catalogLoaded = false;

function openDataCatalog() {
  let modal = document.getElementById('agent-catalog-modal');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'agent-catalog-modal';
    modal.style.cssText =
      'position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;' +
      'padding:16px;background:rgba(0,0,0,0.75)';
    modal.innerHTML = `
      <div style="background:#111827;border:1px solid #374151;border-radius:16px;width:100%;max-width:900px;
                  max-height:88vh;display:flex;flex-direction:column;box-shadow:0 25px 50px rgba(0,0,0,0.5)">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #374151">
          <div>
            <div style="color:#f1f5f9;font-weight:600;font-size:14px">📊 플랫폼 전체 데이터 현황</div>
            <div style="color:#64748b;font-size:11px;margin-top:2px" id="ac-timestamp">Trino 실시간 조회 중...</div>
          </div>
          <button onclick="document.getElementById('agent-catalog-modal').style.display='none'"
            style="color:#64748b;font-size:20px;background:none;border:none;cursor:pointer;padding:0 6px">✕</button>
        </div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 20px;border-bottom:1px solid #1f2937">
          <div style="background:#1f2937;border-radius:10px;padding:10px 12px">
            <div style="color:#64748b;font-size:10px">조회 상태</div>
            <div style="color:#f1f5f9;font-weight:700;font-size:13px;margin-top:4px" id="ac-status">로딩 중...</div>
          </div>
          <div style="background:#1f2937;border-radius:10px;padding:10px 12px">
            <div style="color:#64748b;font-size:10px">활성 테이블</div>
            <div style="color:#f1f5f9;font-weight:700;font-size:16px;margin-top:4px" id="ac-tables">—</div>
          </div>
          <div style="background:#1f2937;border-radius:10px;padding:10px 12px">
            <div style="color:#64748b;font-size:10px">실제 총 건수</div>
            <div style="color:#f1f5f9;font-weight:700;font-size:16px;margin-top:4px" id="ac-rows">—</div>
          </div>
          <div style="background:#1f2937;border-radius:10px;padding:10px 12px">
            <div style="color:#64748b;font-size:10px">조회 시각</div>
            <div style="color:#94a3b8;font-size:11px;margin-top:4px" id="ac-time">—</div>
          </div>
        </div>
        <div id="ac-loading" style="flex:1;display:flex;align-items:center;justify-content:center;padding:40px">
          <div style="text-align:center">
            <div style="width:24px;height:24px;border:2px solid #334155;border-top-color:#6366f1;
                        border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 10px"></div>
            <div style="color:#64748b;font-size:13px">Trino 쿼리 실행 중... (최대 60초 소요)</div>
          </div>
        </div>
        <div id="ac-body" style="display:none;flex:1;overflow-y:auto;padding:16px 20px;gap:20px;flex-direction:column"></div>
        <div id="ac-chart-wrap" style="display:none;padding:0 20px 16px">
          <div id="ac-chart" style="height:180px"></div>
        </div>
      </div>`;
    modal.addEventListener('click', e => {
      if (e.target === modal) modal.style.display = 'none';
    });
    document.body.appendChild(modal);
  } else {
    modal.style.display = 'flex';
  }
  if (!_catalogLoaded) _loadCatalog();
}

function _fmtNum(n) {
  if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
  return n.toLocaleString();
}

async function _loadCatalog() {
  try {
    const res = await fetch('/api/data-catalog');
    const data = await res.json();
    _renderCatalog(data);
    _catalogLoaded = true;
  } catch(e) {
    document.getElementById('ac-loading').innerHTML =
      `<div style="color:#f87171;font-size:13px">오류: ${e.message}</div>`;
  }
}

function _renderCatalog(data) {
  document.getElementById('ac-status').textContent = '✅ 조회 완료';
  document.getElementById('ac-status').style.color = '#4ade80';
  document.getElementById('ac-tables').textContent = data.total_tables + ' 개';
  document.getElementById('ac-rows').textContent = _fmtNum(data.total_rows) + ' 건';
  document.getElementById('ac-time').textContent = data.generated_at;
  document.getElementById('ac-timestamp').textContent =
    `실제 Trino 쿼리 기준 · ${data.generated_at}`;
  document.getElementById('ac-loading').style.display = 'none';

  const body = document.getElementById('ac-body');
  body.style.display = 'flex';
  body.innerHTML = data.workspaces.map(ws => {
    const active = ws.tables.filter(t => t.status==='active').length;
    return `<div style="margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <span style="font-size:16px">${esc(ws.icon)}</span>
        <span style="color:#f1f5f9;font-weight:600;font-size:13px">${esc(ws.name)}</span>
        <span style="font-size:10px;padding:2px 8px;border-radius:99px;background:#1f2937;color:#94a3b8">${active}/${ws.tables.length} 활성</span>
        <span style="font-size:10px;padding:2px 8px;border-radius:99px;background:#1e3a5f;color:#38bdf8">${_fmtNum(ws.total_rows)} 건</span>
        ${ws.note ? `<span style="font-size:10px;color:#fb923c">ℹ ${esc(ws.note)}</span>` : ''}
      </div>
      <div style="border:1px solid #374151;border-radius:10px;overflow:hidden">
        <table style="width:100%;font-size:11px;border-collapse:collapse">
          <thead>
            <tr style="background:#1f2937">
              <th style="text-align:left;padding:7px 10px;color:#64748b;font-weight:500">테이블명</th>
              <th style="text-align:left;padding:7px 10px;color:#64748b;font-weight:500">영문명</th>
              <th style="text-align:left;padding:7px 10px;color:#64748b;font-weight:500">설명</th>
              <th style="text-align:right;padding:7px 10px;color:#64748b;font-weight:500">건수</th>
              <th style="text-align:center;padding:7px 10px;color:#64748b;font-weight:500">상태</th>
            </tr>
          </thead>
          <tbody>
            ${ws.tables.map((t,i) => `
              <tr style="background:${i%2===0?'#0f172a':'#111827'}">
                <td style="padding:6px 10px;color:#e2e8f0;font-weight:500">${esc(t.table_kr)}</td>
                <td style="padding:6px 10px;color:#64748b;font-family:monospace">${esc(t.table_en)}</td>
                <td style="padding:6px 10px;color:#64748b">${esc(t.desc)}</td>
                <td style="padding:6px 10px;text-align:right;font-family:monospace;
                           color:${t.row_count>0?'#22d3ee':'#334155'}">
                  ${t.row_count>0 ? _fmtNum(t.row_count) : '—'}
                </td>
                <td style="padding:6px 10px;text-align:center;color:${t.status==='active'?'#4ade80':'#334155'}">
                  ${t.status==='active' ? '● 활성' : '○ 미생성'}
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
  }).join('');

  // 차트
  const wrap = document.getElementById('ac-chart-wrap');
  wrap.style.display = 'block';
  const labels=[], values=[], colors=[];
  data.workspaces.forEach(ws => {
    ws.tables.forEach(t => {
      if (t.row_count > 0) {
        labels.push(t.table_kr || t.table_en);
        values.push(t.row_count);
        colors.push(
          ws.catalog==='tpcds'      ? '#6366f1' :
          ws.catalog==='postgresql' ? '#4ade80' : '#22d3ee'
        );
      }
    });
  });
  if (typeof Plotly !== 'undefined') {
    Plotly.newPlot('ac-chart', [{
      type:'bar', x:labels, y:values, marker:{color:colors},
      hovertemplate:'<b>%{x}</b><br>%{y:,} 건<extra></extra>',
    }], {
      paper_bgcolor:'transparent', plot_bgcolor:'transparent',
      margin:{t:8,b:55,l:45,r:8},
      xaxis:{tickfont:{color:'#64748b',size:9},gridcolor:'#1e293b'},
      yaxis:{tickfont:{color:'#64748b',size:9},gridcolor:'#1e293b'},
      showlegend:false,
    }, {responsive:true,displayModeBar:false});
  }
}
document.addEventListener('keydown', e => {
  const m = document.getElementById('agent-catalog-modal');
  if (e.key==='Escape' && m) m.style.display='none';
});
</script>
